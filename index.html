:root{--bg:#faf7ef;--surface:#fff;--soft:#fff3c9;--mint:#f7f1df;--text:#433a2a;--muted:#75664d;--accent:#85600f;--line:#e8ddc5;--edge:#9b8455;--focus:#795508;--button:#f2c94c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 94% 0%,#f5d66a24,transparent 46%),var(--bg);color:var(--text);font:16px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}button,input,select{font:inherit;color:inherit}button,a,select,input{touch-action:manipulation}button,select{min-height:44px;border:1px solid var(--edge);border-radius:8px;background:var(--surface);cursor:pointer}button{padding:9px 16px;text-align:center}button:hover,select:hover{background:var(--soft)}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:4px}button:disabled{opacity:.45;cursor:default}a{color:var(--accent);text-underline-offset:4px}h1,h2,h3,p{margin:0}h1:focus{outline:none}h1{font-size:32px;line-height:1.4;letter-spacing:.02em;margin-bottom:12px}h2{font-size:23px;line-height:1.5;margin-bottom:12px}h3{font-size:19px;line-height:1.5;margin-bottom:8px}p+p{margin-top:12px}ul,ol{margin:10px 0;padding-left:24px}li{margin:8px 0}strong{font-weight:700}.wrap{max-width:1040px;margin:auto;padding:24px 32px 32px}.top{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:32px;min-height:48px}.brand{font-size:15px;font-weight:650;display:flex;align-items:center;gap:10px}.mark{display:inline-block;width:12px;height:12px;border-radius:4px;background:#c99d2c;transform:rotate(-12deg)}.tag,.eyebrow{font-size:14px;color:var(--accent)}.eyebrow{font-weight:650;margin-bottom:8px}.intro{color:var(--muted);max-width:720px}.hero{margin-bottom:24px}.hero h1{font-size:36px}.hero-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:20px}.primary{background:var(--button);border-color:var(--edge);font-weight:650}.secondary{background:var(--surface);font-size:14px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.flow{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:start;padding:20px 18px;min-height:170px;text-align:left;border-color:var(--line);background:var(--surface)}.flow:nth-child(4),.flow:nth-child(5){background:var(--mint)}.num{font-size:32px;line-height:1.25;font-weight:750;color:var(--accent)}.flow-title{display:block;font-size:22px;font-weight:700;line-height:1.45;margin:0 0 10px}.flow-desc{display:block;font-size:15px;color:var(--muted);line-height:1.75}.footer-note{font-size:14px;color:var(--muted);margin-top:18px}.detail{max-width:860px;margin:auto}.detail-head{margin-bottom:24px}.topics{display:grid;grid-template-columns:1fr 1fr;gap:12px}.topic{display:flex;align-items:center;gap:12px;min-height:84px;text-align:left;padding:16px 18px;border-color:var(--line)}.topic .n{font-size:22px;color:var(--accent);font-weight:700}.topic .name{font-size:18px;font-weight:650;line-height:1.55}.arrow{margin-left:auto;color:var(--accent)}.panel{padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:12px}.label{font-size:14px;font-weight:650;color:var(--accent);margin-bottom:8px}.operation{margin-top:20px}.note{border-left:3px solid #c99d2c;padding:14px 18px;margin-top:20px;background:var(--soft);border-radius:0 8px 8px 0}.note p{font-size:15px;line-height:1.85}.note strong{display:block;margin-bottom:6px}.nav{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;border-top:1px solid var(--line);padding-top:20px;margin-top:24px}.nav button:first-child{justify-self:start}.nav button:last-child{justify-self:end}.nav button:nth-child(2){justify-self:center}.textbtn{background:transparent;border-color:transparent;color:var(--accent)}.quick{display:flex;gap:8px;align-items:center;max-width:400px}.quick label{font-size:14px;white-space:nowrap;color:var(--muted)}select{padding:7px 36px 7px 12px;width:100%;max-width:300px;text-overflow:ellipsis}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.two .panel{padding:20px}.space{margin-top:18px}.guide-note{padding:14px 18px;background:var(--mint);font-size:14px;border-radius:8px;margin-top:18px;color:var(--muted)}.help-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.help-card{padding:18px;text-align:left;border-color:var(--line)}.help-card strong{display:block;font-size:18px;margin-bottom:6px}.help-card span{font-size:15px;color:var(--muted)}.source{font-size:14px;color:var(--muted);margin-top:18px}.mock-label{font-size:14px;font-weight:650;color:var(--accent);margin-bottom:12px}.mock{border:1px solid var(--edge);border-radius:10px;padding:20px;background:var(--surface);margin-top:18px}.mock-fields{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0}.field{padding:12px;background:var(--mint);border:1px solid var(--line);border-radius:8px}.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}input{min-height:44px;max-width:100%;width:100%;padding:8px;border:1px solid var(--edge);background:var(--surface);border-radius:6px}.weekday{display:block;font-weight:650;padding-top:5px}.feedback{padding-top:12px;color:var(--accent);min-height:40px;font-size:15px}.mock-menu[hidden]{display:none}.mock-menu{padding:10px;margin:12px 0;border:1px solid var(--edge);border-radius:8px;display:flex;flex-wrap:wrap;gap:8px;background:var(--soft)}.mock-block{padding:16px;border:1px solid var(--line);border-radius:8px;margin:10px 0}.mock-block h3{margin:0}.mini{font-size:14px}.block-header{display:flex;justify-content:space-between;gap:12px;align-items:center}.block-header strong{font-size:18px}.no-content{color:var(--muted);padding:14px}.mock details{padding:8px 0}summary{cursor:pointer;min-height:44px;line-height:44px}.mock details p{padding-left:20px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

@media(max-width:650px){.cards{grid-template-columns:1fr}.flow{grid-template-columns:32px 1fr;min-height:110px;gap:14px}.flow-title{margin-bottom:5px}.flow-desc{font-size:15px}.hero-actions{gap:8px}.hero-actions>button{padding:9px 12px}.hero-actions>.secondary{font-size:14px}}@media(max-width:380px){.cards{grid-template-columns:1fr}.flow{min-height:120px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

/* v9: wider reading lanes, one consistent surface, quieter quick-jump menu. */
.hero-actions>.secondary{display:inline-flex;align-items:center;gap:8px}
.rescue-icon{width:21px;height:21px;flex:none;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.flow{grid-template-columns:40px minmax(0,1fr) 18px;align-items:center;gap:14px;padding:22px 20px;min-height:144px;border-color:var(--line);background:var(--surface);border-radius:12px;position:relative}
.flow:nth-child(4),.flow:nth-child(5){background:var(--surface)}
.flow:last-child{grid-column:1/-1;min-height:116px}
.flow .num{font-size:28px;line-height:1.3;align-self:start;padding-top:1px;font-variant-numeric:tabular-nums;font-weight:650;letter-spacing:-1px}

const data=[{"title": "早安，整理今天", "desc": "看看本週任務，安排今天的工作與提醒，也別忘了照顧自己。", "location": "當週任務與提醒工具", "steps": [["看看這週還有哪些事", "先掌握本週尚未完成的任務。", "查看「當週任務」與「未完成緊急案件」，確認哪些事情必須在這週完成。", "排在本週，代表你安排這週完成；還沒完成的，就需要持續留意。"], ["安排今天要推進的事", "決定今天要做什麼，不必一早把整週全部做完。", "在當週日曆調整任務日期，再到 Work 查看工作任務的輕重緩急。", "日期：安排處理、完成，或下次追問的日子。\n截止日：這件事最晚必須完成的期限。\n\n日期改了，也要確認星期幾。手動調整日期後，開啟任務按「魔法，變！」，避免手機看板的星期分組與日期不同。"], ["檢查今天的簡易待辦", "把今天的單次事項與例行公事看一遍。", "到提醒工具檢查既有安排；還沒排入的，選擇「例行公事」或「一次性任務」新增。", "需要固定時間想起來，就使用指定時間；需要過一段時間提醒，再使用倒數計時。"], ["也把自己排進今天", "啟動喝水提醒，別讓忙碌蓋過身體的需要。", "設定適合自己的提醒間隔並啟動；第一次使用，可以先試看提醒。", ""]], "practice": "date"}, {"title": "有新事情，先接住", "desc": "遇到臨時交辦或突發會議，先記下來，再慢慢補齊安排。", "location": "頁面最上方的快速擷取區", "steps": [["這件事需要留下來追蹤嗎？", "先選擇適合的記錄方式。", "做完就結束：放進簡易提醒，設定指定時間或倒數計時。例如訂餐、取物、提醒自己打一次電話。", "需要追蹤或留下經驗：使用最上方的快速擷取按鈕，建立 Notion 任務。\n\n同一件追蹤任務也可以搭配提醒：任務卡保存內容，提醒工具負責叫你回來處理。"], ["選一個合適的入口", "依照事情的類型，選擇快速按鈕。", "臨時工作：收到臨時交辦、插單工作。\n臨時會議：突然開會，或記錄與廠商、客戶、承辦的互動。\n自我進修：學習、進修或個人興趣任務。\n生活日常：家庭、小孩與生活相關任務。\n專案任務：建立新的大專案，例如案場或學習專案。\n專案排程：替案場逐步安排需要的申請流程。", ""], ["臨時很忙，至少先寫這一項", "把預設標題改成「實際要做的事」。", "各任務入口會自動帶入當天日期；先寫清楚任務名稱，其他資訊有空再補。", "例如：「一般工作任務」→「整理○○案補件資料」；「臨時會議」→「記錄○○案與承辦電話討論」。\n\n先接住事情，不必為了填完所有欄位，打斷原本的工作。"], ["有空時，再把安排補清楚", "讓剛記下的事情，變成之後看得懂、做得下去的任務。", "以臨時工作為例，確認「今天須處理」「對專案有決定性影響」，按「魔法，變！」；需要時補上對象、截止日、相關人員與專案。", "不是今天處理，就調整日期，並同步更新星期幾。"], ["可選支線｜有新專案了", "先建立專案，再安排需要的行動。", "用「專案任務」建立專案，選擇所屬領域。案場要安排申請流程時，再進「專案排程」。", "依案場需要，從 11 個申請流程中逐步安排，不必一次排完。"]], "practice": "title"}, {"title": "回到工作，持續推進", "desc": "挑選下一件事、留下處理紀錄，讓等待與追問都有安排。", "location": "Work 分頁與對應任務卡", "steps": [["選下一件可以動手的事", "回到 Work，看看現在適合推進哪張任務。", "依「今天須處理」與「對專案有決定性影響」形成的四象限，判斷先後順序，再開啟任務卡。", ""], ["邊處理，邊留下必要紀錄", "文件、聯絡與處理過程，留在原任務裡。", "在流程任務中檢查文件是否齊全，記錄補件、送件、承辦回覆與下一步。", "人員的特殊聯絡資訊，放回人員頁。例如出差期間、代理人或替代聯絡方式，記在人員個人頁，方便其他任務一起參考。"], ["現在需要等別人嗎？", "先判斷：可以明天再追，還是今天一定要完成？", "可以明天再追：按「快回覆我 !」，自動勾選「等待追蹤」、把日期設為明天，並同步調整星期幾。不會建立提醒，也不會變更截止日或將任務標成完成。", "今天一定要完成：只手動勾選「等待追蹤」，不要按「快回覆我 !」。保留今天的日期；需要定時或多次追問時，再到簡易提醒安排時間。\n\n今天一定要完成，請勿按下會移到明天的按鈕。"], ["提醒響起時，當下決定", "能做就處理；現在不能做，就立即改期。", "簡易提醒完成後確認完成；需要晚點處理，當下延後或改成未來待辦。", "完成一次「追問提醒」，不代表原本的追蹤任務已經完成。有新進度時，要補回任務卡。"], ["等待結束，繼續原任務", "收到回覆後，確認接下來能做什麼。", "不再等待時，取消「等待追蹤」；需要繼續等，就更新紀錄與下次追問安排。", "文件送出，不代表整個申請流程已完成。同一張流程任務繼續追蹤，直到收到公文、達到這個流程的完成條件，再取消等待並勾選完成。"]], "practice": "wait"}, {"title": "有人問進度，快速找到答案", "desc": "從案場全貌到任務細節，不必靠記憶，也能找到需要的資訊。", "location": "Work 分頁的案場進度狀況／所有任務", "steps": [["想知道案場整體狀況", "先看全貌，再看細節。", "到 Work 的「案場進度狀況」，查看目前進度、卡關問題與下一步；需要看位置時，切換「案場分布」。", ""], ["想知道某件事處理到哪裡", "開啟對應任務，查看實際處理紀錄。", "從任務內容確認已做的事、等待事項與後續安排，不必靠記憶回答。", "需要特殊聯絡資訊時，再開啟相關人員頁。"], ["找不到那張任務", "回到 Work 的「所有任務」找。", "這裡能查看各領域、不同日期，以及已完成與未完成的任務，不必進原始資料庫翻找。", ""]]}, {"title": "今天辛苦了，收尾複盤", "desc": "看見今天的成果，留下值得保留的經驗，安心交給明天。", "location": "今日已完成任務、提醒工具與快速存檔魔法", "steps": [["先看看，你今天完成了什麼", "你做的，不只有工作。", "開啟「今日已完成任務」，一起看看工作、家庭與個人任務，透過任務類型辨認今天的付出。", "這一步先看見成果，不要求每張卡都寫心得。"], ["挑出值得留下的經驗", "今天有沒有什麼，能讓下次的自己少走一點彎路？", "開啟值得回顧的已完成任務，找出特別註記的經驗，再請 AI 協助整理進相關專案。", "可以先想：發生了什麼？怎麼處理？下次能怎麼做？\n\n複盤格式先保留彈性，不是每張任務都要填一份表，也不是系統已自動整理完成。請 AI 整理後，自己再確認內容。"], ["把簡易待辦的紀錄留下來", "小事也算數，想保留就先存起來。", "到提醒工具的「今日已完成」按一鍵複製，再貼進「簡易任務封存」。", "重要提醒：提醒工具的當日完成紀錄會在隔天重置，想留下的請在重置前複製。\n\n「簡易任務封存」是短期查找區，可依你的習慣每一至兩週整理，最多保留約一個月。"], ["把明天交給系統", "確認明天要做與要追問的事，都有安排。", "查看明日任務與未來預排提醒；今天未能處理的提醒，應已在提醒當下完成改期。", ""], ["有空的時候，也記錄自己", "不用急，留一段時間寫下今天的心情。", "在「快速存檔魔法」選擇符合心情的按鈕，開啟已帶入對應心情的日誌，再慢慢填寫。", "這是可選的個人時間，不是每天收工前必須完成的功課。"]]}],helps=[{"title": "剛剛按錯了，先怎麼辦？", "desc": "先停止連續點擊，確認剛才改了什麼。", "lead": "先停一下，不用急著再按一次。", "steps": ["剛刪到文字或移動區塊：電腦可先試復原（Windows：Ctrl + Z；Mac：⌘ + Z）。手機可在頁面右上角「•••」找復原／Undo。", "如果按的是系統按鈕，先打開受影響的任務，確認日期、等待追蹤、完成勾選等欄位。不要假設一次復原就會還原按鈕的所有動作。"], "note": "復原適用於可復原的編輯動作，不保證能撤回所有按鈕、自動化或外部提醒。", "source": "https://www.notion.so/help/writing-and-editing-basics"}, {"title": "任務突然不見了", "desc": "先找檢視與篩選，再檢查是否被刪除。", "lead": "看不到，不一定是刪掉了。", "steps": ["先到 Work 的「所有任務」，用任務名稱或關鍵字找；也確認是否切到不同分頁或檢視。", "檢查日期是否移到別天、是否勾了完成、是否變成等待追蹤。篩選條件不同，任務可能不會出現在原本的畫面。", "整個頁面找不到時，從側邊欄「搜尋」輸入頁面名稱；若不記得名稱，可回相關專案或人員頁找關聯任務。", "確定刪除了，再檢查垃圾桶。找不到或出現無權限訊息時，請擁有者確認頁面位置與存取權，不要一直重建相同任務。"], "note": "不要為了找一張任務，就刪除整個檢視、資料庫或篩選設定。"}, {"title": "誤刪頁面或內容", "desc": "頁面看垃圾桶，舊內容看版本紀錄。", "lead": "先分清楚：是整頁不見，還是頁面內的內容被改了？", "steps": ["整頁被刪除：在側邊欄開啟「垃圾桶／Trash」，搜尋頁面，確認內容後選擇還原。手機可從側邊欄左上「•••」找垃圾桶。", "頁面還在、內容改錯：先試復原；需要更早內容時，開啟頁面右上角「•••」→「版本紀錄／Version history」，先預覽再決定。", "若只需救回一小段，優先從舊版本複製所需內容，避免整頁還原蓋掉後來正確的修改。"], "note": "可查看的版本範圍依方案而異；垃圾桶有保留期限。永久刪除後不能保證找回，請不要按永久刪除。", "source": "https://www.notion.so/help/duplicate-delete-and-restore-content"}, {"title": "日期、等待或完成按錯", "desc": "回原任務確認欄位，不必重建一張。", "lead": "先修正原任務，讓紀錄繼續留在同一個地方。", "steps": ["誤按完成：找到原任務，取消完成勾選，再確認日期與所在檢視。", "誤按「快回覆我 !」：檢查等待追蹤、日期與星期幾。若今天仍須處理，將日期改回今天，並按「魔法，變！」同步星期幾；等待追蹤依實際狀況保留或取消。", "只有日期與星期不一致：先確認正確日期，再按「魔法，變！」，回手機看板確認分組。", "提醒工具是另一套安排；任務日期改好後，也要另外檢查提醒是否需要修改。"], "note": "「快回覆我 !」不會替你建立提醒；完成一次追問，也不代表原任務已完成。"}, {"title": "文字、標題與清單區塊", "desc": "一段文字就是一個區塊，先會新增和換類型。", "lead": "把內容當積木，一次處理一塊就好。", "steps": ["電腦：在空白行輸入 /，選文字、標題、項目清單、待辦或切換清單。", "要換現有區塊的類型，滑鼠移到左側「六點把手」，點開選單後選「轉換為／Turn into」。", "手機：點內容進入編輯，使用鍵盤上方工具列的「＋」新增區塊；操作入口可能因版本而稍有差異。"], "note": "待辦勾選框是內容區塊，不一定等於任務資料庫的「完成」欄位。", "source": "https://www.notion.so/help/writing-and-editing-basics"}, {"title": "展開、複製與移動區塊", "desc": "用小三角展開，用區塊選單整理位置。", "lead": "先確認選到的是哪一塊，再移動或複製。", "steps": ["切換清單：點文字左邊的小三角就能展開或收合，收起來不代表內容被刪除。", "電腦滑鼠移到左側「六點把手」：拖曳可調整位置；點開則可選複製、移至或刪除。", "複製會多出一份獨立內容，不會自動和原本同步；移動則是換位置。", "手機沒有滑鼠懸停，請使用選取與編輯工具列；不要為了展開內容而長按拖曳。"], "note": "系統版面、資料庫與同步區塊先不要隨意移動或刪除；只整理自己的文字內容最安心。", "source": "https://www.notion.so/help/writing-and-editing-basics"}, {"title": "只是檢視，還是動到資料？", "desc": "切分頁通常只是換畫面，改欄位會影響原任務。", "lead": "同一張任務，可能會出現在好幾個畫面。", "steps": ["切換 Work、任務檢視或展開說明，通常是在換觀看方式，不會因此完成或刪除任務。", "改日期、勾完成或編輯任務內容，則是在改原本的資料，其他檢視也可能跟著變。", "刪除資料庫裡的一筆任務，不只是把它從目前畫面藏起來。想先不看它，先確認篩選或檢視，不要直接刪除。"], "note": "先看清楚，再動手；不知道怎麼救時，不需要自己一路試到底。"}];
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>esc(s).replace(/^(臨時工作|臨時會議|自我進修|生活日常|專案任務|專案排程)(：)/,'<strong>$1</strong>$2').replace(/「([^」]+)」/g,'<strong>「$1」</strong>');
const paras=s=>s.split(/\n\n/).filter(Boolean).map(x=>`<p>${fmt(x).replace(/\n/g,'<br>')}</p>`).join('');
const btn=(text,route,cls='')=>`<button class="${cls}" data-route="${route}">${text}</button>`;
const order=['start',...data.flatMap((s,i)=>[String(i),...s.steps.map((_,n)=>`${i}-${n}`)]),'done'];
function menu(r){let opts=[],label='快速前往';
 if(/^[0-4]-[0-9]+$/.test(r)||r==='practice-date'){const i=r==='practice-date'?0:Number(r.split('-')[0]);opts=data[i].steps.map((st,n)=>`<option value="${i}-${n}">${n+1}. ${st[0]}</option>`);label=data[i].title+'的操作說明'}
 else if(r.startsWith('aid-')){opts=helps.map((s,i)=>`<option value="aid-${i}">${i+1}. ${s.title}</option>`);label='急救主題'}
 else{opts=data.map((s,i)=>`<option value="${i}">${i+1}. ${s.title}</option>`);label='流程快速選單';opts.unshift('<option value="" disabled>選擇想看的流程</option>')}
 return `<div class="quick"><select id="quick-jump" aria-label="${label}">${opts.join('')}</select></div>`}

function header(r){return r==='home'?'':`<header class="top">${menu(r)}</header>`}
function nav(r){let prev='home',next=null;
 if(order.includes(r)){const ix=order.indexOf(r);prev=order[ix-1]||'home';next=order[ix+1]||null}
 if(r==='practice-date'){prev='0-1';next='0-2'}
 if(r==='aid'){prev='home';next='aid-0'}
 if(r.startsWith('aid-')){const i=Number(r.split('-')[1]);prev=i?'aid-'+(i-1):'aid';next=i<helps.length-1?'aid-'+(i+1):null}
 return `<nav class="nav" aria-label="導覽操作">${btn('上一步',prev)}${btn('導覽首頁','home','textbtn')}${next?btn('下一步 →',next,'primary'):'<button disabled>下一步 →</button>'}</nav>`}
function home(){return `<section class="hero"><p class="eyebrow">從容一點，讓系統幫你接住事情</p><h1 tabindex="-1">陪喬小姐，走過一天</h1><p class="intro">事情很多，不必全部記在腦袋裡。<br>從早上安排、臨時插單，到下班收尾，一步一步熟悉這套系統。</p><div class="hero-actions">${btn('第一次使用請看我','start','primary')}${btn('<svg class="rescue-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6V4h8v2M4 7h16v14H4zM12 10v8M8 14h8"/></svg>安心急救站','aid','secondary')}</div></section><section class="cards" aria-label="五大流程">${data.map((s,i)=>`<button class="flow" data-route="${i}"><span class="num">0${i+1}</span><span class="flow-copy"><span class="flow-title">${s.title}</span><span class="flow-desc">${s.desc}</span></span><span class="flow-arrow" aria-hidden="true">→</span></button>`).join('')}</section>`}
function start(){return `<article class="detail"><header class="detail-head"><p class="eyebrow">第一次使用</p><h1 tabindex="-1">先準備好，再陪喬小姐過一天</h1><p class="intro">不用一次學會所有功能。先接住事情、安排日期，再找回完成的任務回顧，就能開始使用。</p></header><section class="two"><div class="panel"><p class="label">01 · 準備自己的系統</p><h2>在自己的模板副本操作</h2><p>登入 Notion；示範任務、人員與專案資料可依需求整理。不確定時，先留幾筆當範例。</p></div><div class="panel"><p class="label">02 · 啟動聲音提醒</p><h2>第一次使用，先試看提醒</h2><p>喝水與任務提醒先點選啟動，熟悉聲音與操作，再安排今天的事情。</p></div></section><section class="panel space"><p class="label">03 · 先分清楚兩種記錄方式</p><h2>做完以後，還需要追蹤或回看嗎？</h2><div class="two"><div><h3>做完就結束 → 簡易待辦</h3><p>例如訂餐、取物、一次性的生活提醒。只需要知道做完沒做完。</p></div><div><h3>需要追蹤 → Notion 任務</h3><p>例如申請流程、補件、學習任務。保留進度、聯絡過程與可回顧的經驗。</p></div></div></section><aside class="guide-note">可以先看懂，再回系統操作；本導覽不會連動真實資料或提醒。</aside>${nav('start')}</article>`}
function section(i){const s=data[i];return `<article class="detail"><header class="detail-head"><h1 tabindex="-1">${s.title}</h1><p class="intro">${s.desc}</p></header><div class="topics">${s.steps.map((st,n)=>`<button class="topic" data-route="${i}-${n}"><span class="n">${n+1}.</span><span class="name">${st[0]}</span><span class="arrow" aria-hidden="true">→</span></button>`).join('')}</div>${nav(String(i))}</article>`}
function step(i,n){const s=data[i],st=s.steps[n];let lines=st[2].split('\n').filter(Boolean);return `<article class="detail"><header class="detail-head"><p class="eyebrow">${s.title}</p><h1 tabindex="-1">${n+1}. ${st[0]}</h1></header><section class="panel"><p class="label">這一步的重點</p><h2>${st[1]}</h2><div class="operation"><p class="label">怎麼操作</p>${i===2&&n===2?`<div class="two"><div class="field"><h3>可以明天再追</h3><p>按<strong>「快回覆我 !」</strong>：勾選等待追蹤、日期移到明天，並同步星期幾。</p><p class="mini">不建立提醒、不變更截止日，也不會勾選完成。</p></div><div class="field"><h3>今天一定要完成</h3><p>只手動勾選<strong>「等待追蹤」</strong>，保留今天的日期；需要定時或多次追問，再到簡易提醒安排。</p><p><strong>不要按「快回覆我 !」，以免日期移到明天。</strong></p></div></div>`:lines.length>1?`<ul>${lines.map(t=>`<li>${fmt(t)}</li>`).join('')}</ul>`:paras(st[2])}</div>${i===2&&n===2?'':st[3]?`<aside class="note"><strong>小提醒</strong>${paras(st[3])}</aside>`:''}</section>${i===0&&n===1?`<aside class="guide-note"><strong>想看看日期與星期如何同步？</strong><p>用獨立示意介面試一次，不會連動 Notion。</p><div class="space">${btn('試試日期同步示範','practice-date','primary')}</div></aside>`:''}${nav(`${i}-${n}`)}</article>`}
function aid(){return `<article class="detail"><header class="detail-head"><p class="eyebrow">安心急救站</p><h1 tabindex="-1">先別慌，我們一步一步找回來</h1><p class="intro">按錯了先停一下；找不到東西，先確認畫面與條件，再檢查是否刪除。</p></header><section class="help-grid">${helps.map((s,i)=>`<button class="help-card" data-route="aid-${i}"><strong>${i+1}. ${s.title}</strong><span>${s.desc}</span></button>`).join('')}</section><aside class="guide-note">這裡提供排查與模擬練習，不會直接修復或變更你的工作區。</aside>${nav('aid')}</article>`}
function aidPage(i){const s=helps[i];return `<article class="detail"><header class="detail-head"><p class="eyebrow">安心急救站</p><h1 tabindex="-1">${s.title}</h1><p class="intro">${s.desc}</p></header><section class="panel"><h2>${s.lead}</h2><ol>${s.steps.map(t=>`<li>${fmt(t)}</li>`).join('')}</ol><aside class="note"><strong>安心提醒</strong><p>${s.note}</p></aside></section>${s.source?`<p class="source">操作參考：<a target="_blank" rel="noopener noreferrer" href="${s.source}">Notion 官方說明 ↗</a></p>`:''}<p class="space">${btn('查看急救主題目錄','aid','textbtn')}</p>${nav('aid-'+i)}</article>`}
function dateDemo(){return `<article class="detail"><header class="detail-head"><p class="eyebrow">獨立模擬互動</p><h1 tabindex="-1">日期與星期同步示範</h1><p class="intro">這是操作邏輯示意，不是 Notion 的真實介面，也不會儲存到任務。</p></header><section class="mock"><p class="mock-label">模擬任務 · 整理案場補件資料</p><p>先改日期，再按「魔法，變！」，觀察星期欄位。</p><div class="mock-fields"><div class="field"><label for="demo-date">日期</label><input id="demo-date" type="date" value="2026-11-21"></div><div class="field"><span class="mini">星期幾</span><output class="weekday" id="weekday">週六</output></div></div><div class="hero-actions"> <button id="magic" class="primary">魔法，變！</button><button id="reset-date">重設示範</button></div><p id="date-feedback" class="feedback" role="status">目前日期與星期一致。改個日期試試看。</p></section>${nav('practice-date')}</article>`}
function bind(r){const sel=document.getElementById('quick-jump');if(sel){sel.value=r==='practice-date'?'0-1':Array.from(sel.options).some(o=>o.value===r)?r:'';sel.onchange=()=>location.hash=sel.value}
 if(r==='practice-date'){const input=document.getElementById('demo-date'),out=document.getElementById('weekday'),msg=document.getElementById('date-feedback');input.onchange=()=>msg.textContent='日期已調整；星期還沒同步，試著按「魔法，變！」。';document.getElementById('magic').onclick=()=>{if(!input.value){msg.textContent='請先選擇一個日期。';return}const d=new Date(input.value+'T12:00:00');out.textContent=['週日','週一','週二','週三','週四','週五','週六'][d.getDay()];msg.textContent='已在示範中同步星期；真實任務沒有變動。'};document.getElementById('reset-date').onclick=()=>{input.value='2026-11-21';out.textContent='週六';msg.textContent='已重設，可以再試一次。'}}

}
function render(){let r=location.hash.slice(1)||'home',body='';if(r==='home')body=home();else if(r==='start')body=start();else if(r==='aid')body=aid();else if(/^aid-[0-6]$/.test(r))body=aidPage(Number(r.split('-')[1]));else if(/^[0-4]$/.test(r))body=section(Number(r));else if(/^[0-4]-[0-9]+$/.test(r)&&data[Number(r.split('-')[0])].steps[Number(r.split('-')[1])])body=step(...r.split('-').map(Number));else if(r==='practice-date')body=dateDemo();else if(r==='done')body=`<article class="detail"><section class="panel"><p class="eyebrow">今天辛苦了</p><h1 tabindex="-1">先接住，再安排，最後安心收尾。</h1><p>不用一次記住所有操作。下次需要時，從流程選單直接找到對應說明就好。</p><div class="hero-actions">${btn('需要時，來安心急救站','aid','primary')}</div></section>${nav(r)}</article>`;else{r='home';body=home()}app.innerHTML=header(r)+body;bind(r);window.scrollTo(0,0);app.querySelector('h1')?.focus({preventScroll:true})}
app.addEventListener('click',e=>{const b=e.target.closest('[data-route]');if(b)location.hash=b.dataset.route});window.addEventListener('hashchange',render);render();
</script></body></html>
